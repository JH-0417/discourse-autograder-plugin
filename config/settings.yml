plugins:
  autograder_enabled:
    default: true
    client: true

  autograder_category_ids:
    default: "7|8|9|10|11|12|13"
    type: list
    list_type: category
    client: false

  autograder_additional_category_bonus:
    default: 0.5
    type: float
    client: false

  autograder_grader_url:
    default: ""
    type: string
    client: false

  autograder_grader_auth_token:
    default: ""
    type: string
    client: false
    secret: true
